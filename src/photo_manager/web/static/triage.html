<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Manager — triage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23222'/><rect x='3' y='3.5' width='10' height='2' rx='1' fill='%23e8b64c'/><rect x='3' y='7' width='7' height='2' rx='1' fill='%23e8b64c' opacity='.6'/><rect x='3' y='10.5' width='4' height='2' rx='1' fill='%23e8b64c' opacity='.35'/></svg>">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="triage-body">

<header class="bar">
  <h1>Triage</h1>
  <span id="counts" class="bar__note"></span>
  <div class="bar__spacer"></div>
  <a class="button button--quiet" href="/library">Library</a>
  <a class="button button--quiet" href="/tag">Tag</a>
</header>

<div id="error" class="banner banner--bad" hidden></div>

<main class="triage">

  <!-- What is left, said as a number before it is said as a list. FR-7.6 is
       about being able to see where the work is. -->
  <section class="triage__head">
    <h2 id="headline" class="triage__headline">—</h2>
    <div class="progress">
      <div class="progress__track"><div id="bar" class="progress__bar"></div></div>
    </div>
    <p id="progress-text" class="tag__hint"></p>
    <p class="tag__hint">
      A photograph is in this list when nothing has been said about it — no place,
      no event, nobody in it, no tags. A star is not a description, so a frame
      rated while culling is still here.
    </p>
  </section>

  <p id="done" class="empty" hidden>
    Nothing left. Every photograph in the library has something said about it.
  </p>

  <ul id="units" class="backlog"></ul>
</main>

<!-- One outing to name — or, before that, one day to settle the shape of. -->
<template id="unit-template">
  <li class="backlog__day">
    <button type="button" class="backlog__open">
      <span class="backlog__date"></span>
      <span class="backlog__when"></span>
      <span class="backlog__count"></span>
      <span class="backlog__state"></span>
    </button>

    <div class="backlog__covers"></div>

    <div class="backlog__panel" hidden>
      <!-- FR-3.2's suggestion, asked rather than assumed. Either answer is a
           decision the person made, and both are one click. -->
      <div class="backlog__shape" hidden>
        <p class="tag__hint backlog__gap"></p>
        <div class="backlog__choice">
          <button type="button" class="button button--go backlog__split"></button>
          <button type="button" class="button backlog__one">One outing</button>
          <span class="tag__hint backlog__shape-note"></span>
        </div>
        <p class="tag__hint backlog__finer" hidden>
          Want some of those blocks together but not others?
          <a href="/tag">Merge them at Tag</a>.
        </p>
      </div>

      <form class="fields backlog__form" autocomplete="off">
        <label class="field">
          <span class="field__label">Location</span>
          <input class="field__input f-location" type="text" list="loc-list"
                 placeholder="St Aldo">
        </label>
        <label class="field">
          <span class="field__label">Event</span>
          <input class="field__input f-event" type="text" placeholder="Beach day">
        </label>
        <label class="field">
          <span class="field__label">People</span>
          <input class="field__input f-people" type="text" list="ppl-list"
                 placeholder="Alice, Bob">
        </label>
        <label class="field">
          <span class="field__label">Tags</span>
          <input class="field__input f-tags" type="text" list="tag-list"
                 placeholder="beach, sunset">
        </label>
        <div class="fields__actions">
          <button type="submit" class="button button--go backlog__apply">Apply</button>
          <span class="tag__hint backlog__note"></span>
        </div>
      </form>

      <p class="tag__hint">
        <a class="backlog__look" href="#">Look at these in the library</a>
      </p>
    </div>
  </li>
</template>

<datalist id="loc-list"></datalist>
<datalist id="ppl-list"></datalist>
<datalist id="tag-list"></datalist>

<script src="/static/strip.js"></script>
<script src="/static/triage.js"></script>
</body>
</html>
